name: Publish releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version number to tag and release"
        required: true
        type: string
      prerelease:
        description: "Release as pre-release"
        required: false
        type: boolean
        default: false

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  release-npm:
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install npm@11.18.0 -g
      - name: pnpm install
        uses: nick-fields/retry@v3.0.2
        with:
          max_attempts: 10
          timeout_minutes: 15
          retry_on: error
          command: pnpm install
      - name: Change version number and sync
        run: |
          node scripts/update-version.js ${{ inputs.version }}
          sh scripts/sync-version.sh
          pnpm -r run --if-present prepublishOnly
      - name: update lockfile
        uses: nick-fields/retry@v3.0.2
        with:
          max_attempts: 10
          timeout_minutes: 15
          retry_on: error
          command: pnpm install
      - name: GIT commit and push all changed files
        run: |
          git config --global user.name "mcollina"
          git config --global user.email "hello@matteocollina.com"
          git commit -a -m "Bumped v${{ inputs.version }}"
          git push origin HEAD:${{ github.ref }}
      - name: Verify prepublish status
        run: git status
      - run: pnpm -r publish --access public --tag ${{ inputs.prerelease == true && 'next' || 'latest' }} --publish-branch ${{ github.ref_name }}
      - name: "Create release notes"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpx @matteo.collina/release-notes -t v${{ inputs.version }} -r platformatic -o platformatic ${{ github.event.inputs.prerelease == 'true' && '-p' || '' }} -c ${{ github.ref }}

  # Releases created with GITHUB_TOKEN do not trigger release-event workflows.
  sync-watt-skill:
    needs: release-npm
    if: ${{ !inputs.prerelease }}
    permissions:
      contents: read
    uses: ./.github/workflows/sync-watt-skill.yml
    with:
      tag: v${{ inputs.version }}
    secrets:
      SKILLS_SYNC_TOKEN: ${{ secrets.SKILLS_SYNC_TOKEN }}
