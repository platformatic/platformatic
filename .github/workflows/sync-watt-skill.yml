name: Sync Watt skill

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag to sync (for example, v4.0.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      SKILLS_SYNC_TOKEN:
        required: true

# Configure SKILLS_SYNC_TOKEN as a repository Actions secret in platformatic/platformatic.
# Use a fine-grained PAT owned by an account with write access to platformatic/skills:
# - Resource owner: platformatic; repository access: only platformatic/skills.
# - Repository permissions: Contents: Read and write; Pull requests: Read and write.
# - Metadata: Read-only (automatically granted). No organization permissions are needed.
# The organization must approve the PAT if its policy requires approval.
# GITHUB_TOKEN cannot write to the other repository; it only reads the source release.
permissions:
  contents: read

concurrency:
  group: sync-watt-skill
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve published stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          release=$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease)
          if ! jq -e '.isDraft == false and .isPrerelease == false' <<< "$release" > /dev/null; then
            echo 'Only published stable releases may sync the Watt skill.' >&2
            exit 1
          fi
          tag=$(jq -r '.tagName' <<< "$release")
          version=${tag#v}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable semantic version release tag.' >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout released skill
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          path: source
          persist-credentials: false

      - name: Checkout skill distribution
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: platformatic/skills
          token: ${{ secrets.SKILLS_SYNC_TOKEN }}
          path: distribution
          persist-credentials: false

      - name: Sync only the Watt skill
        run: |
          set -euo pipefail
          test -f source/docs/skills/watt/SKILL.md
          mkdir -p distribution/skills/watt
          rsync -a --delete source/docs/skills/watt/ distribution/skills/watt/

      # No diff means no commit or PR. Re-running a release updates its existing PR.
      - name: Create or update release skill PR
        working-directory: distribution
        env:
          GH_TOKEN: ${{ secrets.SKILLS_SYNC_TOKEN }}
          GH_REPO: platformatic/skills
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SYNC_BRANCH: sync-watt-skill-${{ steps.release.outputs.version }}
          PR_BODY: |
            ## Summary

            Sync `skills/watt/` from `docs/skills/watt/` in the Platformatic release [${{ steps.release.outputs.tag }}](https://github.com/platformatic/platformatic/releases/tag/${{ steps.release.outputs.tag }}).

            Platformatic is the source of truth. This replaces the Watt skill, including removed files, without changing other skills, commands, or agents.
        run: |
          set -euo pipefail
          git add -- skills/watt
          if git diff --cached --quiet; then
            echo 'The distributed Watt skill already matches this release.'
            exit 0
          fi

          gh auth setup-git --hostname github.com
          base=$(gh repo view --json defaultBranchRef --jq '.defaultBranchRef.name')

          # Only replace the automation branch if it has not changed since we read it.
          expected=$(git ls-remote --heads origin "refs/heads/$SYNC_BRANCH" | cut -f1)
          git checkout -b "$SYNC_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: Updated Watt skill for $RELEASE_TAG."
          git push --force-with-lease="refs/heads/$SYNC_BRANCH:$expected" origin "HEAD:refs/heads/$SYNC_BRANCH"

          title="chore: Update Watt skill for $RELEASE_TAG"
          pr=$(gh pr list --state open --head "$SYNC_BRANCH" --base "$base" --json number --jq '.[0].number // empty')
          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" --title "$title" --body "$PR_BODY"
          else
            gh pr create --base "$base" --head "$SYNC_BRANCH" --title "$title" --body "$PR_BODY"
          fi
