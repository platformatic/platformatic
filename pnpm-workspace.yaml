packages:
  # all packages in direct subdirs of packages/
  - 'packages/*'
allowBuilds:
  '@datadog/pprof': true
  '@fastify/pre-commit': true
  '@nestjs/core': true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
autoInstallPeers: true
childConcurrency: 1
hoist: false
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@platformatic/*'
  # Renovate security update: protobufjs@8.0.1
  - protobufjs@8.0.1
  # Renovate security update: fast-uri@3.1.2 || 4.1.1 || 4.1.5
  - fast-uri@3.1.2 || 4.1.1 || 4.1.5
  # Renovate security update: next@16.2.5 || 16.2.6 || 16.3.6 || 16.3.8
  - next@16.2.5 || 16.2.6 || 16.3.6 || 16.3.8
  # Renovate security update: astro@6.4.6
  - astro@6.4.6
  # Renovate security update: tar@7.5.16 || 7.5.21
  - tar@7.5.16 || 7.5.21
  # Renovate security update: vite@7.3.5
  - vite@7.3.5
  # Renovate security update: undici@7.28.0 || 7.29.0 || 7.29.1
  - undici@7.28.0 || 7.29.0 || 7.29.1
  # Renovate security update: @astrojs/node@11.0.2 || 11.1.3
  - "@astrojs/node@11.0.2 || 11.1.3"
  # Renovate security update: find-my-way@9.7.0
  - find-my-way@9.7.0
  # Renovate security update: @fastify/static@10.1.2
  - "@fastify/static@10.1.2"
  # Renovate security update: fastify@5.12.5
  - fastify@5.12.5
  # Renovate security update: @nestjs/platform-fastify@11.2.4
  - "@nestjs/platform-fastify@11.2.4"
  # OpenTelemetry 0.223 / 2.12 update (#5191), also carries GHSA-qqmp-wf37-98f9 fix for instrumentation-pg
  - "@opentelemetry/api-logs@0.223.0"
  - "@opentelemetry/configuration@0.223.0"
  - "@opentelemetry/context-async-hooks@2.12.0"
  - "@opentelemetry/core@2.12.0"
  - "@opentelemetry/exporter-logs-otlp-grpc@0.223.0"
  - "@opentelemetry/exporter-logs-otlp-http@0.223.0"
  - "@opentelemetry/exporter-logs-otlp-proto@0.223.0"
  - "@opentelemetry/exporter-metrics-otlp-grpc@0.223.0"
  - "@opentelemetry/exporter-metrics-otlp-http@0.223.0"
  - "@opentelemetry/exporter-metrics-otlp-proto@0.223.0"
  - "@opentelemetry/exporter-prometheus@0.223.0"
  - "@opentelemetry/exporter-trace-otlp-grpc@0.223.0"
  - "@opentelemetry/exporter-trace-otlp-http@0.223.0"
  - "@opentelemetry/exporter-trace-otlp-proto@0.223.0"
  - "@opentelemetry/exporter-zipkin@2.12.0"
  - "@opentelemetry/instrumentation-express@0.71.0"
  - "@opentelemetry/instrumentation-http@0.223.0"
  - "@opentelemetry/instrumentation-pg@0.75.0"
  - "@opentelemetry/instrumentation-undici@0.33.0"
  - "@opentelemetry/instrumentation@0.223.0"
  - "@opentelemetry/otlp-exporter-base@0.223.0"
  - "@opentelemetry/otlp-grpc-exporter-base@0.223.0"
  - "@opentelemetry/otlp-transformer@0.223.0"
  - "@opentelemetry/propagator-b3@2.12.0"
  - "@opentelemetry/propagator-jaeger@2.12.0"
  - "@opentelemetry/resources@2.12.0"
  - "@opentelemetry/sdk-logs@0.223.0"
  - "@opentelemetry/sdk-metrics@2.12.0"
  - "@opentelemetry/sdk-node@0.223.0"
  - "@opentelemetry/sdk-trace-base@2.12.0"
  - "@opentelemetry/sdk-trace-node@2.12.0"
  - "@opentelemetry/sdk-trace@2.12.0"
nodeLinker: hoisted
# With the hoisted linker, a tree containing several esbuild versions can end up with the
# `esbuild` package and the hoisted `@esbuild/<platform>` binary at different versions, which
# makes esbuild refuse to start ("Host version ... does not match binary version ...").
# Keeping a single version avoids the mismatch.
overrides:
  esbuild: 0.28.2
  # @nestjs/platform-fastify@11 pins fastify@5.11.3, which has known high severity CVEs
  # fixed in 5.12.2. Remove when moving to Nest 12, which pins fastify@5.12.5.
  '@nestjs/platform-fastify>fastify': 5.12.5
packageImportMethod: copy
preferSymlinkedExecutables: true
resolutionMode: highest
strictPeerDependencies: false
