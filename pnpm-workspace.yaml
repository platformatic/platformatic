packages:
  # all packages in direct subdirs of packages/
  - 'packages/*'
allowBuilds:
  '@datadog/pprof': true
  '@fastify/pre-commit': true
  '@nestjs/core': true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
autoInstallPeers: true
childConcurrency: 1
hoist: false
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@platformatic/*'
  # fastify-user@2.0.0 was published on 2026-10-13; it fixes the fast-jwt 5 advisories via @fastify/jwt 10
  - fastify-user@2.0.0
  # @fastify/static@10.1.9 was published on 2026-11-04; it moves to glob 14, fixing the glob AbortSignal advisory
  - '@fastify/static@10.1.9'
  # Renovate security update: protobufjs@8.0.1
  - protobufjs@8.0.1
  # @fastify/compress@9.3.0 was published on 2026-10-27; it adds flushOnIdle, used by the gateway compression
  - '@fastify/compress@9.3.0'
  # @mercuriusjs/gateway@5.3.0 was published on 2026-11-18; it fixes federated entity resolution with graphql@16.15.0
  - '@mercuriusjs/gateway@5.3.0'
  # Renovate security update: fast-uri@3.1.2 || 4.1.1 || 4.1.5
  - fast-uri@3.1.2 || 4.1.1 || 4.1.5
  # Renovate security update: next@16.2.5 || 16.2.6 || 16.3.6 || 16.3.8 || 16.4.5
  - next@16.2.5 || 16.2.6 || 16.3.6 || 16.3.8 || 16.4.5
  # Renovate security update: astro@6.4.6 || 7.4.7
  - astro@6.4.6 || 7.4.7
  # Renovate security update: tar@7.5.16 || 7.5.21
  - tar@7.5.16 || 7.5.21
  # Renovate security update: vite@7.3.5
  - vite@7.3.5
  # Renovate security update: undici@7.28.0 || 7.29.0 || 7.29.1
  - undici@7.28.0 || 7.29.0 || 7.29.1
  # Renovate security update: @astrojs/node@11.0.2 || 11.1.3
  - "@astrojs/node@11.0.2 || 11.1.3"
  # Renovate security update: find-my-way@9.7.0
  - find-my-way@9.7.0
  # Renovate security update: @fastify/static@10.1.2
  - "@fastify/static@10.1.2"
  # Renovate security update: fastify@5.12.5
  - fastify@5.12.5
  # Renovate security update: @nestjs/platform-fastify@11.2.4
  - "@nestjs/platform-fastify@11.2.4"
  # pino-opentelemetry-transport@5.0.0 was published on 2026-11-19; it moves to OpenTelemetry JS SDK 3.x
  - pino-opentelemetry-transport@5.0.0
  # Renovate security update: graphql-scalars@2.0.1
  - graphql-scalars@2.0.1
  # Renovate security update: nuxt@4.6.4
  - nuxt@4.6.4
nodeLinker: hoisted
# With the hoisted linker, a tree containing several esbuild versions can end up with the
# `esbuild` package and the hoisted `@esbuild/<platform>` binary at different versions, which
# makes esbuild refuse to start ("Host version ... does not match binary version ...").
# Keeping a single version avoids the mismatch.
overrides:
  esbuild: 0.28.2
  # @nestjs/platform-fastify@11 pins fastify@5.11.3, which has known high severity CVEs
  # fixed in 5.12.2. Remove when moving to Nest 12, which pins fastify@5.12.5.
  '@nestjs/platform-fastify>fastify': 5.12.8
  # self-cert is only used in tests. Remove when upstream supports Pino 10.
  'self-cert@2.0.1>pino': ^10.1.0
packageImportMethod: copy
preferSymlinkedExecutables: true
resolutionMode: highest
strictPeerDependencies: false
